<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background matching app bg-base -->
  <rect width="32" height="32" rx="5" fill="#0a0a18"/>

  <!-- Ascending candlestick chart — mirrors the logo-mark right-side motif -->
  <!-- Candle 1: short -->
  <line x1="5.5" y1="21" x2="5.5" y2="23" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="3" y="23" width="5" height="5" rx="1" fill="#00e5ff"/>
  <line x1="5.5" y1="28" x2="5.5" y2="30" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Candle 2: medium-small -->
  <line x1="12.5" y1="15" x2="12.5" y2="18" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="10" y="18" width="5" height="7" rx="1" fill="#00e5ff"/>
  <line x1="12.5" y1="25" x2="12.5" y2="27" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Candle 3: medium-large -->
  <line x1="19.5" y1="9" x2="19.5" y2="12" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="17" y="12" width="5" height="11" rx="1" fill="#00e5ff"/>
  <line x1="19.5" y1="23" x2="19.5" y2="26" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Candle 4: tallest -->
  <line x1="26.5" y1="3" x2="26.5" y2="5" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="24" y="5" width="5" height="16" rx="1" fill="#00e5ff"/>
  <line x1="26.5" y1="21" x2="26.5" y2="24" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
</svg>

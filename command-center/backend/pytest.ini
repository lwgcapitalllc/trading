[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: requires live VPS + NT8 running in RDP session

# `-m "not integration"` is a SAFETY interlock, not a speed optimisation.
#
# tests/test_integration.py drives the live VPS: it submits real backtests and, in Case 6,
# kills a running agent on purpose. Its docstring has always said to select it explicitly,
# and nothing enforced that — a bare `pytest tests/` ran it, and the standing advice was to
# remember `--ignore=tests/test_integration.py` every single time. An interlock you have to
# remember is not an interlock.
#
# Deselected by default here, so the destructive suite runs only when someone ASKS for it:
#     pytest tests/test_integration.py -m integration
# A `-m` on the command line replaces this one, which is what makes that line work.
addopts = --ignore=.venv -m "not integration"

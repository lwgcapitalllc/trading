<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Running Man — Canvas Prototype</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #080c16; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    padding: 56px 48px; min-height: 100vh;
  }
  .page-label { font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:#2d4260; margin-bottom:20px; font-weight:600; }
  .banner {
    background: linear-gradient(150deg, rgba(0,200,180,0.055) 0%, rgba(8,14,28,0.97) 50%);
    border: 1px solid rgba(0,200,180,0.18); border-radius:14px; padding:20px 40px; max-width:860px;
  }
  .chart-row { position:relative; height:100px; margin-bottom:10px; }
  #cv { position:absolute; bottom:0; }
  .stages { display:flex; align-items:flex-start; }
  .stage  { flex:1; display:flex; flex-direction:column; align-items:center; position:relative; }
  .stage::before { content:''; position:absolute; top:4px; left:calc(-50% + 8px); right:calc(50% + 8px); height:2px; background:rgba(255,255,255,0.07); transition:background .5s; }
  .stage:first-child::before { display:none; }
  .stage.done::before, .stage.active::before { background:rgba(0,200,180,0.5); }
  .dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.1); flex-shrink:0; position:relative; z-index:2; transition:background .4s, border-color .4s, box-shadow .4s; }
  .stage.done .dot   { background:#00c8b4; border-color:#00c8b4; }
  .stage.active .dot { background:#00c8b4; border-color:#00c8b4; box-shadow:0 0 0 5px rgba(0,200,180,0.12),0 0 16px rgba(0,200,180,0.5); }
  .stage-label { margin-top:11px; font-size:10px; letter-spacing:.07em; color:rgba(255,255,255,0.18); white-space:nowrap; transition:color .4s; text-transform:uppercase; }
  .stage.done .stage-label   { color:rgba(0,200,180,0.5); }
  .stage.active .stage-label { color:#00c8b4; font-weight:600; }
  .info-row { display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.05); }
  .msg { display:flex; align-items:center; gap:8px; font-size:11.5px; color:rgba(255,255,255,0.38); }
  .pulse-dot { width:5px; height:5px; border-radius:50%; background:#00c8b4; flex-shrink:0; box-shadow:0 0 6px #00c8b4; animation:pdot 1.8s ease-in-out infinite; }
  @keyframes pdot { 0%,100%{opacity:1} 50%{opacity:.2} }
  .elapsed { font-size:11.5px; color:rgba(255,255,255,0.2); font-variant-numeric:tabular-nums; }
  .controls { display:flex; gap:10px; margin-top:40px; align-items:center; }
  .controls-hint { font-size:11px; color:#2d4260; margin-left:4px; }
  button { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#c0cfe0; padding:8px 18px; border-radius:8px; font-size:12px; cursor:pointer; transition:background .15s; font-family:inherit; }
  button:hover { background:rgba(255,255,255,0.12); }
  button.accent { background:rgba(0,200,180,0.12); border-color:rgba(0,200,180,0.3); color:#00c8b4; }
  button.accent:hover { background:rgba(0,200,180,0.22); }
</style>
</head>
<body>
<div style="max-width:860px;margin:0 auto;">
  <div class="page-label">Progress Banner — Running Man Canvas Prototype</div>
  <div class="banner">
    <div class="chart-row" id="chartRow">
      <canvas id="cv" height="90"></canvas>
    </div>
    <div class="stages" id="stages"></div>
    <div class="info-row">
      <span class="msg"><span class="pulse-dot"></span><span id="msgText">Connecting…</span></span>
      <span class="elapsed" id="elapsed">0s</span>
    </div>
  </div>
  <div class="controls">
    <button class="accent" onclick="nextStep()">Next step →</button>
    <button onclick="resetDemo()">Reset</button>
    <span class="controls-hint">Click to advance stages, or watch it auto-run</span>
  </div>
</div>
<script>
const STAGES   = ['Connect','Configure','Run','Results','Evaluate']
const MESSAGES = ['Connecting to VPS agent…','Configuring SA parameters…','Running backtest…','Exporting trade data…','Evaluating against firm rules…']
const STEP_PCTS = [0,20,30,70,95]
let step=0, pct=0, secs=0

function renderStages() {
  const el = document.getElementById('stages')
  el.innerHTML = ''
  STAGES.forEach((label,i) => {
    const div = document.createElement('div')
    div.className = 'stage'+(i<step?' done':i===step?' active':'')
    div.innerHTML = '<div class="dot" data-dot></div><div class="stage-label">'+label+'</div>'
    el.appendChild(div)
  })
  document.getElementById('msgText').textContent = MESSAGES[Math.min(step,MESSAGES.length-1)]
  requestAnimationFrame(measureAndAlign)
}
function updateStep() {
  let s=0; for(let i=STEP_PCTS.length-1;i>=0;i--){if(pct>=STEP_PCTS[i]){s=i;break}} if(s!==step){step=s;renderStages()}
}
function nextStep(){ step=Math.min(step+1,STAGES.length-1); pct=STEP_PCTS[step]+1; renderStages() }
function resetDemo(){ step=0;pct=0;secs=0;renderStages() }
setInterval(()=>{ secs++; const e=document.getElementById('elapsed'); e.textContent=secs<60?secs+'s':Math.floor(secs/60)+'m '+(secs%60)+'s' },1000)
setInterval(()=>{ if(pct>=100)return; pct=Math.min(100,pct+0.35); updateStep() },100)

const cv  = document.getElementById('cv')
const ctx = cv.getContext('2d')
const CH  = cv.height   // 90
let CW=0, dotXs=[]

function measureAndAlign(){
  const row=document.getElementById('chartRow')
  const dots=Array.from(document.querySelectorAll('[data-dot]'))
  if(dots.length<2)return
  const rowR=row.getBoundingClientRect()
  const fR=dots[0].getBoundingClientRect(), lR=dots[dots.length-1].getBoundingClientRect()
  const left=fR.left+fR.width/2-rowR.left, right=lR.left+lR.width/2-rowR.left
  cv.style.left=left+'px'; cv.width=CW=Math.round(right-left)
  const cl=parseFloat(cv.style.left)||0
  dotXs=dots.map(d=>{const r=d.getBoundingClientRect();return r.left+r.width/2-rowR.left-cl})
}
window.addEventListener('resize',measureAndAlign)

// ── Figure constants ───────────────────────────────────────────────────────
const BODY_L  = 18
const THIGH_L = 14
const SHIN_L  = 13
const UPPER_L = 11
const FORE_L  = 9
const HEAD_R  = 7
const LEAN    = 0.18   // forward tilt of torso
const GY      = CH - 6 // ground y = 84

const C   = '#00c8b4'
const DIM = 'rgba(0,200,180,0.38)'

function seg(ax,ay,bx,by,lw,clr){
  ctx.strokeStyle=clr; ctx.lineWidth=lw; ctx.lineCap='round'
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke()
}

// angle=0 → straight down (+y), positive → rightward (forward for runner)
function jnt(ox,oy,a,l){ return [ox+Math.sin(a)*l, oy+Math.cos(a)*l] }

function drawRunner(figX, ts) {
  const phase = ts * 0.006
  const sp    = Math.sin(phase)
  const bob   = 2.2 * (1 - Math.abs(sp))   // body rises at mid-stride

  const hipX = figX
  const hipY = GY - 26 - bob   // ~58 at sp=±1, ~56 at sp=0

  // Torso: from hip going UP with forward lean
  // Use negative cos to go upward: (sin(LEAN)*BODY_L, -cos(LEAN)*BODY_L)
  const shX = hipX + Math.sin(LEAN) * BODY_L
  const shY = hipY - Math.cos(LEAN) * BODY_L   // ~40

  // Head: above shoulder
  const headX = shX + Math.sin(LEAN) * (HEAD_R + 2)
  const headY = Math.max(HEAD_R + 4, shY - Math.cos(LEAN) * (HEAD_R + 2))  // ~31, clamped

  // ── Compute all four limbs ─────────────────────────────────────────────
  function legJoints(leg_i) {
    const lp  = phase + (leg_i === 0 ? 0 : Math.PI)
    const ls  = Math.sin(lp)          // +1 = max forward, -1 = max back
    const SWING = 0.55

    // Thigh: from hip going DOWN at thighA (positive = forward)
    const thighA    = ls * SWING
    const [kx, ky]  = jnt(hipX, hipY, thighA, THIGH_L)

    // Shin: when forward (ls>0) foot continues toward ground
    //       when back (ls<0) knee bends so foot kicks up behind (classic butt-kick)
    const kneeFlx   = Math.max(0, -ls)             // 0 when forward, 1 when fully back
    const shinA     = thighA + 0.18 - kneeFlx * 1.55
    // ls=+1: shinA = 0.73   → foot lands forward of knee near ground ✓
    // ls=-1: shinA = -1.92  → cos(-1.92)=-0.35, sin=-0.94 → foot kicks up and back ✓
    const [fx, fy]  = jnt(kx, ky, shinA, SHIN_L)

    return { kx, ky, fx, fy, back: ls < 0 }
  }

  function armJoints(arm_i) {
    // Arms swing opposite to same-side leg
    const ap  = phase + (arm_i === 0 ? Math.PI : 0)
    const as_ = Math.sin(ap)
    const ARM_SWING = 0.42

    // Upper arm: from shoulder going DOWN (runner holds elbow low, wrist up)
    // Base ~0.2 rad forward (lean), swings ±ARM_SWING
    const upperA    = as_ * ARM_SWING + 0.15
    const [ex, ey]  = jnt(shX, shY, upperA, UPPER_L)
    // Elbow is always below shoulder ✓ (cos is always positive for these angles)

    // Forearm: from elbow going UP (cos must be negative → angle > π/2)
    // foreA ≈ π keeps forearm pointing straight up; slight compensation so it follows arm swing
    const foreA     = Math.PI - upperA * 0.22
    const [wx, wy]  = jnt(ex, ey, foreA, FORE_L)
    // as_=+1: elbow forward-down, wrist above elbow at shoulder height ✓
    // as_=-1: elbow back-down, wrist above elbow at shoulder height ✓

    return { ex, ey, wx, wy, back: as_ < 0 }
  }

  const legs = [legJoints(0), legJoints(1)]
  const arms = [armJoints(0), armJoints(1)]

  // Draw back limbs first (Z-order: behind body)
  for (const {kx,ky,fx,fy,back} of legs.filter(l=>l.back)) {
    seg(hipX,hipY, kx,ky, 2.2, DIM)
    seg(kx,ky,     fx,fy, 2.0, DIM)
  }
  for (const {ex,ey,wx,wy,back} of arms.filter(a=>a.back)) {
    seg(shX,shY, ex,ey, 2.0, DIM)
    seg(ex,ey,   wx,wy, 1.8, DIM)
  }

  // Body
  seg(hipX,hipY, shX,shY, 2.6, C)
  ctx.fillStyle=C; ctx.beginPath(); ctx.arc(headX,headY,HEAD_R,0,Math.PI*2); ctx.fill()

  // Front limbs (Z-order: in front of body)
  for (const {kx,ky,fx,fy,back} of legs.filter(l=>!l.back)) {
    seg(hipX,hipY, kx,ky, 2.2, C)
    seg(kx,ky,     fx,fy, 2.0, C)
  }
  for (const {ex,ey,wx,wy,back} of arms.filter(a=>!a.back)) {
    seg(shX,shY, ex,ey, 2.0, C)
    seg(ex,ey,   wx,wy, 1.8, C)
  }
}

// ── Draw loop ──────────────────────────────────────────────────────────────
function draw(ts) {
  requestAnimationFrame(draw)
  if (CW === 0) return

  ctx.clearRect(0,0,CW,CH)
  const cursorX = pct/100*CW

  // Checkpoint dashed lines
  dotXs.forEach((dx,i) => {
    if(i===0)return
    const passed = cursorX>=dx-1
    ctx.strokeStyle=passed?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.06)'
    ctx.setLineDash([2,4]); ctx.lineWidth=1
    ctx.beginPath(); ctx.moveTo(dx,0); ctx.lineTo(dx,CH); ctx.stroke()
    ctx.setLineDash([])
  })

  // Ground trail
  if(cursorX>1){
    ctx.strokeStyle='rgba(0,200,180,0.18)'; ctx.lineWidth=1.5
    ctx.beginPath(); ctx.moveTo(0,GY); ctx.lineTo(cursorX,GY); ctx.stroke()
  }

  // Glow halo
  if(pct>0&&pct<100){
    const g=ctx.createRadialGradient(cursorX,CH*0.5,0,cursorX,CH*0.5,36)
    g.addColorStop(0,'rgba(0,200,180,0.07)'); g.addColorStop(1,'rgba(0,200,180,0)')
    ctx.fillStyle=g; ctx.fillRect(cursorX-36,0,72,CH)
  }

  if(pct>=0&&pct<=100) drawRunner(cursorX,ts)

  // % pill
  if(pct>0&&pct<100){
    const label=Math.round(pct)+'%'
    ctx.font='bold 10.5px "SF Mono","Fira Code",monospace'
    const tw=ctx.measureText(label).width
    const px=cursorX+5
    ctx.fillStyle='rgba(0,28,24,0.85)'
    ctx.strokeStyle='rgba(0,200,180,0.35)'; ctx.lineWidth=1
    ctx.beginPath(); ctx.roundRect(px-3,3,tw+8,16,4)
    ctx.fill(); ctx.stroke()
    ctx.fillStyle='#00c8b4'; ctx.textAlign='left'
    ctx.fillText(label,px+1,15)
  }
}

renderStages()
requestAnimationFrame(()=>{ measureAndAlign(); requestAnimationFrame(draw) })
</script>
</body>
</html>
